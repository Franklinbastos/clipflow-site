<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Retorno do login — Clipflow</title>
<meta name="description" content="Página de retorno do login do TikTok no Clipflow.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="brand"><span>Clipflow</span></header>
<main>
  <h1 id="titulo">Conectando…</h1>
  <p class="lead" id="mensagem">Devolvendo a autorização para o Clipflow aberto no seu computador.</p>

  <div class="panel" id="painel" hidden>
    <p id="ajuda">Se nada acontecer, abra o Clipflow e cole este código na tela de conexão:</p>
    <p class="code" id="codigo"></p>
    <button type="button" id="copiar">Copiar código</button>
    <p><a id="link" href="#">Abrir o Clipflow local</a></p>
  </div>
</main>
<footer>
  <a href="/">Início</a> ·
  <a href="/termos.html">Termos de Uso</a> ·
  <a href="/privacidade.html">Política de Privacidade</a>
</footer>
<script>
  // Esta página não guarda nada: ela só repassa o código para o Clipflow local.
  const params = new URLSearchParams(location.search);
  const titulo = document.getElementById('titulo');
  const mensagem = document.getElementById('mensagem');
  const painel = document.getElementById('painel');
  const erro = params.get('error');
  const code = params.get('code');

  if (erro) {
    titulo.textContent = 'Autorização não concluída';
    mensagem.textContent = params.get('error_description') || erro;
  } else if (!code) {
    titulo.textContent = 'Nada para conectar';
    mensagem.textContent = 'Abra esta página pelo botão de conexão do Clipflow.';
  } else {
    const porta = params.get('porta') || '4173';
    const destino = new URL(`http://127.0.0.1:${porta}/oauth/tiktok`);
    ['code', 'state', 'scopes'].forEach((chave) => {
      const valor = params.get(chave);
      if (valor) destino.searchParams.set(chave, valor);
    });

    document.getElementById('codigo').textContent = code;
    document.getElementById('link').href = destino.toString();
    document.getElementById('copiar').addEventListener('click', async (event) => {
      try {
        await navigator.clipboard.writeText(code);
        event.target.textContent = 'Copiado';
      } catch {
        event.target.textContent = 'Copie manualmente';
      }
    });
    painel.hidden = false;
    titulo.textContent = 'Autorização recebida';
    mensagem.textContent = 'Levando você de volta ao Clipflow…';
    setTimeout(() => location.replace(destino.toString()), 1200);
  }
</script>
</body>
</html>
